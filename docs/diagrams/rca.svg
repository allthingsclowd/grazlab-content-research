<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 500" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print','Bradley Hand',cursive" font-size="15">
  <rect x="0" y="0" width="1040" height="500" fill="#ffffff"/>
  <text x="520" y="36" text-anchor="middle" font-size="24" fill="#1e1e1e">Why it exists — the under-fill bug</text>
  <text x="520" y="58" text-anchor="middle" font-size="13" fill="#868e96">2026-06-22: an edition held at 7 AI shorts (floor 8 / target 10) with 33 fresh candidates available</text>

  <!-- divider -->
  <line x1="520" y1="86" x2="520" y2="476" stroke="#dee2e6" stroke-width="2" stroke-dasharray="3 6"/>

  <!-- BEFORE -->
  <text x="262" y="110" text-anchor="middle" font-size="19" fill="#e03131">BEFORE — one shot</text>

  <rect x="120" y="128" width="284" height="56" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
  <text x="262" y="152" text-anchor="middle" fill="#1e1e1e">33 candidates in the pool</text>
  <text x="262" y="172" text-anchor="middle" font-size="12" fill="#495057">deterministic, validated</text>

  <rect x="120" y="206" width="284" height="64" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
  <text x="262" y="230" text-anchor="middle" fill="#1e1e1e">clip to 12,000 chars ✂️</text>
  <text x="262" y="252" text-anchor="middle" font-size="12" fill="#c92a2a">tail candidates silently dropped</text>

  <rect x="120" y="292" width="284" height="64" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/>
  <text x="262" y="316" text-anchor="middle" fill="#1e1e1e">ONE JSON call asks for N</text>
  <text x="262" y="338" text-anchor="middle" font-size="12" fill="#c92a2a">then  [:num_shorts]  — no top-up</text>

  <rect x="150" y="382" width="224" height="62" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2.5"/>
  <text x="262" y="408" text-anchor="middle" font-size="18" fill="#e03131">7 shorts 😞</text>
  <text x="262" y="430" text-anchor="middle" font-size="12" fill="#c92a2a">edition HELD — rides on one response</text>

  <g stroke="#e03131" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path d="M262 184 L262 204"/>
    <path d="M262 270 L262 290"/>
    <path d="M262 356 L262 380"/>
  </g>

  <!-- AFTER -->
  <text x="780" y="110" text-anchor="middle" font-size="19" fill="#2f9e44">AFTER — per item</text>

  <rect x="638" y="128" width="284" height="56" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
  <text x="780" y="152" text-anchor="middle" fill="#1e1e1e">33 candidates in the pool</text>
  <text x="780" y="172" text-anchor="middle" font-size="12" fill="#495057">the FULL pool — nothing clipped</text>

  <rect x="638" y="206" width="284" height="64" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/>
  <text x="780" y="230" text-anchor="middle" fill="#1e1e1e">gauge each · stop at threshold</text>
  <text x="780" y="252" text-anchor="middle" font-size="12" fill="#5f3dc4">draws deeper when one is weak</text>

  <rect x="638" y="292" width="284" height="64" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/>
  <text x="780" y="316" text-anchor="middle" fill="#1e1e1e">write ONE item per call</text>
  <text x="780" y="338" text-anchor="middle" font-size="12" fill="#5f3dc4">source link re-stamped, never invented</text>

  <rect x="666" y="382" width="228" height="62" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2.5"/>
  <text x="780" y="408" text-anchor="middle" font-size="18" fill="#2f9e44">10 shorts 🎉</text>
  <text x="780" y="430" text-anchor="middle" font-size="12" fill="#2b8a3e">reliable whenever the pool holds enough</text>

  <g stroke="#2f9e44" stroke-width="2" fill="none" marker-end="url(#ag)">
