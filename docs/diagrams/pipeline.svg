<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 470" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print','Bradley Hand',cursive" font-size="15">
  <rect x="0" y="0" width="1040" height="470" fill="#ffffff"/>
  <text x="520" y="34" text-anchor="middle" font-size="24" fill="#1e1e1e">The desk pipeline — draw from the full pool, stop at the threshold</text>
  <text x="520" y="56" text-anchor="middle" font-size="13" fill="#868e96">one identical run per "desk"  ·  blue = deterministic (no LLM)  ·  purple = one cheap LLM call per item</text>

  <!-- sources -->
  <rect x="24" y="120" width="130" height="78" rx="12" fill="#e9ecef" stroke="#495057" stroke-width="2"/>
  <text x="89" y="150" text-anchor="middle" fill="#1e1e1e">sources</text>
  <text x="89" y="170" text-anchor="middle" font-size="12" fill="#495057">RSS · Atom</text>
  <text x="89" y="186" text-anchor="middle" font-size="12" fill="#495057">YouTube · Serper</text>

  <!-- crawl -->
  <rect x="190" y="112" width="140" height="94" rx="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
  <text x="260" y="142" text-anchor="middle" fill="#1e1e1e">crawl</text>
  <text x="260" y="162" text-anchor="middle" font-size="12" fill="#1864ab">last 24h →</text>
  <text x="260" y="178" text-anchor="middle" font-size="12" fill="#1864ab">candidates[]</text>
  <text x="260" y="196" text-anchor="middle" font-size="11" fill="#e03131">empty ⇒ fail loud</text>

  <!-- okf store -->
  <rect x="366" y="112" width="140" height="94" rx="12" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
  <text x="436" y="138" text-anchor="middle" fill="#1e1e1e">okf_store</text>
  <text x="436" y="158" text-anchor="middle" font-size="12" fill="#2b8a3e">per-run bundle</text>
  <text x="436" y="174" text-anchor="middle" font-size="12" fill="#2b8a3e">→ S3 artifact</text>
  <text x="436" y="194" text-anchor="middle" font-size="11" fill="#2b8a3e">provenance + grounding</text>

  <!-- relevance loop (big) -->
  <rect x="542" y="100" width="246" height="120" rx="14" fill="#d0bfff" stroke="#6741d9" stroke-width="2.5"/>
  <text x="665" y="126" text-anchor="middle" font-size="16" fill="#1e1e1e">relevance loop</text>
  <text x="665" y="148" text-anchor="middle" font-size="12" fill="#5f3dc4">randomise(seed = date)</text>
  <text x="665" y="166" text-anchor="middle" font-size="12" fill="#5f3dc4">for each candidate:</text>
  <text x="665" y="183" text-anchor="middle" font-size="12" fill="#5f3dc4">gauge → relevant?</text>
  <text x="665" y="200" text-anchor="middle" font-size="13" fill="#e8590c">STOP at threshold ✋</text>
  <text x="665" y="214" text-anchor="middle" font-size="11" fill="#5f3dc4">borderline → web-fetch · thin → top-up</text>

  <!-- generate -->
  <rect x="824" y="112" width="140" height="94" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/>
  <text x="894" y="140" text-anchor="middle" fill="#1e1e1e">generate</text>
  <text x="894" y="160" text-anchor="middle" font-size="12" fill="#5f3dc4">one call</text>
  <text x="894" y="176" text-anchor="middle" font-size="12" fill="#5f3dc4">per item</text>
  <text x="894" y="195" text-anchor="middle" font-size="11" fill="#2b8a3e">source link re-stamped</text>

  <!-- output -->
  <rect x="824" y="248" width="140" height="70" rx="12" fill="#ffec99" stroke="#f08c00" stroke-width="2"/>
  <text x="894" y="278" text-anchor="middle" fill="#1e1e1e">N written items</text>
  <text x="894" y="298" text-anchor="middle" font-size="12" fill="#e8590c">each with its link</text>

  <!-- arrows -->
  <g stroke="#1e1e1e" stroke-width="2" fill="none" marker-end="url(#ah)">
    <path d="M156 159 L186 159"/>
    <path d="M332 159 L362 159"/>
    <path d="M508 159 L538 159"/>
    <path d="M790 159 L820 159"/>
    <path d="M894 208 L894 244"/>
  </g>
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#1e1e1e" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- desk config callout -->
  <rect x="190" y="250" width="316" height="86" rx="12" fill="#fff4e6" stroke="#f08c00" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="348" y="274" text-anchor="middle" font-size="14" fill="#e8590c">a "desk" = one config object</text>
  <text x="348" y="296" text-anchor="middle" font-size="12" fill="#7c4700">{ name, sources, threshold, floor,</text>
  <text x="348" y="313" text-anchor="middle" font-size="12" fill="#7c4700">relevance_prompt, generate_prompt, model }</text>
  <text x="348" y="330" text-anchor="middle" font-size="11" fill="#868e96">the library runs the identical pipeline per desk</text>
  <path d="M348 250 C 360 235, 470 225, 600 222" stroke="#f08c00" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#aho)"/>
  <defs>
    <marker id="aho" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#f08c00" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- footnote -->
  <text x="520" y="398" text-anchor="middle" font-size="13" fill="#495057">Deterministic where correctness matters (crawl · dedup · OKF · threshold counting); probabilistic only for the gauge + the prose.</text>
  <text x="520" y="420" text-anchor="middle" font-size="13" fill="#495057">The gate + publish stay in each site — the library owns crawl → select → generate.</text>
  <text x="520" y="450" text-anchor="middle" font-size="12" fill="#adb5bd">🤖 diagram + library generated by Claude (Anthropic) · Geek with the Peak / The Scripting Paddy</text>
</svg>
