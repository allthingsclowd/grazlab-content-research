<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" font-family="'Comic Sans MS','Chalkboard SE','Comic Neue','Segoe Print','Bradley Hand',cursive" font-size="15">
  <rect x="0" y="0" width="1040" height="430" fill="#ffffff"/>
  <text x="520" y="36" text-anchor="middle" font-size="24" fill="#1e1e1e">One engine · many desks · three sites</text>
  <text x="520" y="58" text-anchor="middle" font-size="13" fill="#868e96">the shared library is how the sites stay at parity instead of drifting apart</text>

  <!-- engine -->
  <rect x="400" y="92" width="240" height="92" rx="14" fill="#a5d8ff" stroke="#1971c2" stroke-width="3"/>
  <text x="520" y="124" text-anchor="middle" font-size="17" fill="#1e1e1e">grazlab-content-research</text>
  <text x="520" y="146" text-anchor="middle" font-size="12" fill="#1864ab">crawl · okf · relevance · generate</text>
  <text x="520" y="164" text-anchor="middle" font-size="12" fill="#1864ab">+ the granular Conductor template</text>
  <text x="520" y="180" text-anchor="middle" font-size="11" fill="#868e96">63 tests · make ci green</text>

  <!-- desks row -->
  <g font-size="13">
    <rect x="44" y="262" width="200" height="78" rx="12" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/>
    <text x="144" y="288" text-anchor="middle" fill="#1e1e1e">craicgpt.ie</text>
    <text x="144" y="309" text-anchor="middle" font-size="12" fill="#5f3dc4">craicgpt-ai</text>
    <text x="144" y="326" text-anchor="middle" font-size="12" fill="#5f3dc4">craicgpt-fun</text>

    <rect x="420" y="262" width="200" height="78" rx="12" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
    <text x="520" y="288" text-anchor="middle" fill="#1e1e1e">thegeekwiththepeak.com</text>
    <text x="520" y="309" text-anchor="middle" font-size="12" fill="#2b8a3e">geek-cyber</text>
    <text x="520" y="326" text-anchor="middle" font-size="11" fill="#868e96">(CTEM brief)</text>

    <rect x="796" y="262" width="200" height="78" rx="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/>
    <text x="896" y="288" text-anchor="middle" fill="#1e1e1e">thescriptingpaddy.com</text>
    <text x="896" y="309" text-anchor="middle" font-size="12" fill="#d9480f">paddy-diary-news</text>
    <text x="896" y="326" text-anchor="middle" font-size="11" fill="#868e96">(ride-diary desk)</text>
  </g>

  <g stroke="#1971c2" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M470 184 C 380 220, 230 230, 150 258"/>
    <path d="M520 184 L520 258"/>
    <path d="M570 184 C 660 220, 810 230, 890 258"/>
  </g>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#1971c2" stroke-width="1.5"/>
    </marker>
  </defs>

  <text x="520" y="378" text-anchor="middle" font-size="13" fill="#495057">Each site keeps its own sources, voice, gate and publish path — only the mechanics are shared.</text>
  <text x="520" y="410" text-anchor="middle" font-size="12" fill="#adb5bd">🤖 diagram + library generated by Claude (Anthropic) · Geek with the Peak / The Scripting Paddy</text>
</svg>
